name: Targeted Tests

# Manual targeted test runs for development loops. The main ci.yml already
# runs the full suite (bin/quality push) on every pull request; this workflow
# exists so a specific test file or path can be run on demand against any
# branch via workflow_dispatch (or gh workflow run).

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Test file or path to run, e.g. test/services/duplicate_detection_service_test.rb'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run targeted tests
        env:
          RAILS_ENV: test
        run: bin/rails test "${{ inputs.test_path }}"
